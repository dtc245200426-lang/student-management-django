# ==========================================
# HTTP - TỰ ĐỘNG CHUYỂN SANG HTTPS
# ==========================================

server {
    listen 80;
    server_name localhost;

    return 301 https://localhost:8443$request_uri;
}


# ==========================================
# HTTPS
# ==========================================

server {
    listen 443 ssl;
    server_name localhost;

    # Chứng chỉ HTTPS self-signed
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Chỉ sử dụng TLS 1.2 và TLS 1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;

        # Chuyển thông tin request cho Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:;" always;
    }
}